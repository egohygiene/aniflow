schema: aniflow.pipeline/v3
name: analyze-transcription
description: Append bounded observed English transcript segments to inspected audio.
inputs:
  - id: source_audio
    artifact_type: audio/wav
    artifact_role: temporal_source
    stream_role: audio
  - id: technical
    artifact_type: application/vnd.aniflow.audio-technical-inspection+json
    artifact_role: validation_evidence
    stream_role: timed_metadata
  - id: analysis
    artifact_type: application/vnd.aniflow.audio-analysis+json
    artifact_role: validation_evidence
    stream_role: timed_metadata
stages:
  - id: analyze_transcription
    depends_on: []
    capability:
      id: aniflow/audio-transcription
      version_requirement: "=1.0.0"
    provider:
      primary:
        registration_id: audio-transcription-native
      fallbacks: []
    inputs:
      - port: audio
        artifacts: [source_audio]
      - port: technical
        artifacts: [technical]
      - port: upstream_analysis
        artifacts: [analysis]
    outputs:
      - port: transcription
        artifacts:
          - id: transcription
            relative_path: artifacts/audio-transcription/transcription.json
            kind: file
      - port: analysis
        artifacts:
          - id: transcription_analysis
            relative_path: artifacts/audio-transcription/analysis.json
            kind: file
    validations:
      - id: transcription_integrity
        artifact: transcription
        contract: aniflow.validation/artifact-integrity/v1
      - id: transcription_analysis_integrity
        artifact: transcription_analysis
        contract: aniflow.validation/artifact-integrity/v1
outputs:
  - id: transcription
    artifact: transcription
    required_validations: [transcription_integrity]
  - id: analysis
    artifact: transcription_analysis
    required_validations: [transcription_analysis_integrity]
