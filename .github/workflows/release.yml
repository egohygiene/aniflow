---
name: Publish reviewed aniflow release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed exact vMAJOR.MINOR.PATCH
        required: true
        type: string
      source_revision:
        description: Full current main revision represented by the signed candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful release-candidate run whose exact bytes were reviewed
        required: true
        type: string
      reviewed:
        description: I reviewed the signed candidate, qualification and rollback evidence
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "aniflow-release-${{ inputs.version }}"
  cancel-in-progress: false

env:
  RELEASE_VERSION: "${{ inputs.version }}"
  RELEASE_SOURCE: "${{ inputs.source_revision }}"
  RELEASE_RUN: "${{ inputs.candidate_run_id }}"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      attestations: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require explicit review
        env:
          REVIEWED: "${{ inputs.reviewed }}"
        run: test "$REVIEWED" = "true"
      - name: Prepare schema dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/python" -m pip install "jsonschema==4.23.0"
      - name: Verify live source, dependencies and candidate run
        env:
          GH_TOKEN: "${{ github.token }}"
        run: >-
          "$RUNNER_TEMP/release-python/bin/python" -B scripts/release.py guard
          --version "$RELEASE_VERSION" --source-revision "$RELEASE_SOURCE" --candidate-run "$RELEASE_RUN"
      - name: Download previously reviewed bytes without rebuilding or resigning
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "aniflow-release-candidate-${{ inputs.source_revision }}"
          path: "${{ runner.temp }}/release-bundle"
          github-token: "${{ github.token }}"
          repository: egohygiene/aniflow
          run-id: "${{ inputs.candidate_run_id }}"
      - name: Verify exact payload, source and retained attestation
        env:
          GH_TOKEN: "${{ github.token }}"
        run: >-
          "$RUNNER_TEMP/release-python/bin/python" -B scripts/release.py verify
          --version "$RELEASE_VERSION" --source-revision "$RELEASE_SOURCE"
          --bundle "$RUNNER_TEMP/release-bundle"
      - name: Hand identical bytes to Relay in this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "aniflow-reviewed-${{ inputs.source_revision }}"
          path: "${{ runner.temp }}/release-bundle"
          if-no-files-found: error
          retention-days: 30
      - name: Record review outcome
        if: always()
        env:
          RELEASE_JOB_STATUS: "${{ job.status }}"
        run: python3 -B scripts/release/receipt.py --stage review --output "$RUNNER_TEMP/release-review.json"
      - name: Retain review outcome and any rejected candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "release-review-outcome-${{ github.run_attempt }}"
          path: |
            ${{ runner.temp }}/release-review.json
            ${{ runner.temp }}/release-bundle
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: review
    permissions:
      actions: read
      contents: write
    # Immutable source pin containing product release-name support; see policy lock.
    uses: egohygiene/relay/.github/workflows/semantic-release.yml@04bd32c8ef492418f47d6df6faee425d6888f341
    with:
      artifact-name: "aniflow-reviewed-${{ inputs.source_revision }}"
      release-version: "${{ inputs.version }}"
      expected-source-revision: "${{ inputs.source_revision }}"
      release-name: aniflow
      profile: binary
      component-id: aniflow
      update-major-alias: false
      artifact-retention-days: 30
