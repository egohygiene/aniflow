schema: aniflow.pipeline/v3
name: reference-nonzero-conformance
description: Deterministic provider nonzero-exit failure fixture.
inputs:
  - id: source_frames
    artifact_type: application/vnd.aniflow.reference-frame-set+directory
    artifact_role: temporal_component
    stream_role: video
stages:
  - id: process_frames
    depends_on: []
    capability:
      id: aniflow/frame.process
      version_requirement: "=1.0.0"
    provider:
      primary:
        registration_id: reference-nonzero
      fallbacks: []
    inputs:
      - port: frames
        artifacts: [source_frames]
    outputs:
      - port: processed_frames
        artifacts:
          - id: transformed_frames
            relative_path: artifacts/failure/nonzero
            kind: directory
    validations:
      - id: transformed_frames_integrity
        artifact: transformed_frames
        contract: aniflow.validation/artifact-integrity/v1
outputs:
  - id: frame_result
    artifact: transformed_frames
    required_validations: [transformed_frames_integrity]
