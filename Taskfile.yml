---
version: "3"

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  build:
    desc: Build the debug binary.
    cmds:
      - cargo build --all-targets

  build:release:
    desc: Build the optimized release binary.
    cmds:
      - cargo build --release

  check:
    desc: Run fast compiler checks.
    cmds:
      - cargo check --all-targets --locked

  format:
    desc: Format Rust source.
    cmds:
      - cargo fmt --all

  format:check:
    desc: Verify Rust formatting.
    cmds:
      - cargo fmt --all -- --check

  names:check:
    desc: Verify lowercase product naming.
    cmds:
      - ./scripts/check-product-names.sh

  names:test:
    desc: Test the lowercase product-name policy.
    cmds:
      - ./scripts/test-product-names.sh

  contracts:check:
    desc: Verify published JSON contracts and examples.
    cmds:
      - python3 scripts/check-contracts.py

  provider:conformance:
    desc: Verify the published provider conformance bundle.
    cmds:
      - cargo test --test provider_conformance --locked

  audio:contracts:
    desc: Verify synthetic normalized audio fixtures and public Rust contract validation.
    cmds:
      - python3 scripts/generate-audio-contract-fixtures.py --check
      - cargo test --locked --test audio_analysis_contracts

  audio:contracts:schema:
    desc: Validate audio examples with an already installed Python jsonschema package.
    cmds:
      - python3 tests/audio_contract_schema.py

  timed-text:formats:
    desc: List strict text-conversion profiles without opening media or running a model.
    env:
      TIMED_TEXT_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - '"$TIMED_TEXT_ANIFLOW" --output json timed-text formats'

  timed-text:convert:
    desc: Convert an explicit text subset into a new package with a completion marker.
    requires:
      vars: [INPUT, FROM, TO, OUTPUT]
    env:
      TIMED_TEXT_INPUT: "{{.INPUT}}"
      TIMED_TEXT_FROM: "{{.FROM}}"
      TIMED_TEXT_TO: "{{.TO}}"
      TIMED_TEXT_OUTPUT: "{{.OUTPUT}}"
      TIMED_TEXT_CONTEXT: '{{.CONTEXT | default ""}}'
      TIMED_TEXT_ALLOW_LOSS: '{{.ALLOW_LOSS | default ""}}'
      TIMED_TEXT_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - |
        set -- --output json timed-text convert --input "$TIMED_TEXT_INPUT" --from "$TIMED_TEXT_FROM" --to "$TIMED_TEXT_TO" --output-directory "$TIMED_TEXT_OUTPUT"
        if [ -n "$TIMED_TEXT_CONTEXT" ]; then
          set -- "$@" --context "$TIMED_TEXT_CONTEXT"
        fi
        if [ -n "$TIMED_TEXT_ALLOW_LOSS" ]; then
          set -- "$@" --allow-loss "$TIMED_TEXT_ALLOW_LOSS"
        fi
        "$TIMED_TEXT_ANIFLOW" "$@"

  timed-text:corpus:
    desc: Run generated timed-text roundtrip, loss and refusal integration fixtures.
    cmds:
      - cargo test --locked --test timed_text

  timed-text:schema:
    desc: Validate timed-text schemas and synthetic examples with installed jsonschema.
    cmds:
      - python3 tests/timed_text_schema.py

  timed-text:smoke:
    desc: Exercise the built timed-text CLI using synthetic temporary text only.
    env:
      TIMED_TEXT_ANIFLOW: '{{.ANIFLOW_BIN | default "target/debug/aniflow"}}'
    cmds:
      - 'python3 scripts/smoke-timed-text.py --aniflow "$TIMED_TEXT_ANIFLOW"'

  audio:inspect:plan:
    desc: Preflight explicitly pinned tools and emit a read-only audio inspection plan.
    requires:
      vars: [INPUT, CONFIGURATION]
    env:
      AUDIO_INSPECTION_INPUT: "{{.INPUT}}"
      AUDIO_INSPECTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_INSPECTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_INSPECTION_ANIFLOW" --output json audio plan
        --input "$AUDIO_INSPECTION_INPUT" --configuration "$AUDIO_INSPECTION_CONFIGURATION"

  audio:inspect:
    desc: Inspect bounded PCM WAV through Pipeline v3 without changing source media.
    requires:
      vars: [INPUT, CONFIGURATION, OUTPUT]
    env:
      AUDIO_INSPECTION_INPUT: "{{.INPUT}}"
      AUDIO_INSPECTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_INSPECTION_OUTPUT: "{{.OUTPUT}}"
      AUDIO_INSPECTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_INSPECTION_ANIFLOW" --output json audio inspect
        --input "$AUDIO_INSPECTION_INPUT" --configuration "$AUDIO_INSPECTION_CONFIGURATION"
        --output-directory "$AUDIO_INSPECTION_OUTPUT"

  audio:inspect:resume:
    desc: Recheck audio inspection dependencies and resume compatible run-local work.
    requires:
      vars: [INPUT, CONFIGURATION, RUN]
    env:
      AUDIO_INSPECTION_INPUT: "{{.INPUT}}"
      AUDIO_INSPECTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_INSPECTION_RUN: "{{.RUN}}"
      AUDIO_INSPECTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_INSPECTION_ANIFLOW" --output json audio resume "$AUDIO_INSPECTION_RUN"
        --input "$AUDIO_INSPECTION_INPUT" --configuration "$AUDIO_INSPECTION_CONFIGURATION"

  audio:signal:plan:
    desc: Preflight pinned audio tools and emit a two-stage signal-analysis plan.
    requires:
      vars: [INPUT, CONFIGURATION, SIGNAL_CONFIGURATION]
    env:
      AUDIO_SIGNAL_INPUT: "{{.INPUT}}"
      AUDIO_SIGNAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_SIGNAL_SETTINGS: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_SIGNAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_SIGNAL_ANIFLOW" --output json audio plan --analysis signal
        --input "$AUDIO_SIGNAL_INPUT" --configuration "$AUDIO_SIGNAL_CONFIGURATION"
        --signal-configuration "$AUDIO_SIGNAL_SETTINGS"

  audio:signal:
    desc: Measure bounded PCM audio without changing source bytes through Pipeline v3.
    requires:
      vars: [INPUT, CONFIGURATION, SIGNAL_CONFIGURATION, OUTPUT]
    env:
      AUDIO_SIGNAL_INPUT: "{{.INPUT}}"
      AUDIO_SIGNAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_SIGNAL_SETTINGS: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_SIGNAL_OUTPUT: "{{.OUTPUT}}"
      AUDIO_SIGNAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_SIGNAL_ANIFLOW" --output json audio analyze --analysis signal
        --input "$AUDIO_SIGNAL_INPUT" --configuration "$AUDIO_SIGNAL_CONFIGURATION"
        --signal-configuration "$AUDIO_SIGNAL_SETTINGS"
        --output-directory "$AUDIO_SIGNAL_OUTPUT"

  audio:signal:resume:
    desc: Recheck exact source, tool and signal settings before run-local checkpoint reuse.
    requires:
      vars: [INPUT, CONFIGURATION, SIGNAL_CONFIGURATION, RUN]
    env:
      AUDIO_SIGNAL_INPUT: "{{.INPUT}}"
      AUDIO_SIGNAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_SIGNAL_SETTINGS: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_SIGNAL_RUN: "{{.RUN}}"
      AUDIO_SIGNAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_SIGNAL_ANIFLOW" --output json audio resume "$AUDIO_SIGNAL_RUN" --analysis signal
        --input "$AUDIO_SIGNAL_INPUT" --configuration "$AUDIO_SIGNAL_CONFIGURATION"
        --signal-configuration "$AUDIO_SIGNAL_SETTINGS"

  audio:transcription:plan:
    desc: Preflight exact local transcription dependencies and emit a source-bound plan.
    requires:
      vars: [INPUT, CONFIGURATION, TRANSCRIPTION_CONFIGURATION]
    env:
      AUDIO_TRANSCRIPTION_INPUT: "{{.INPUT}}"
      AUDIO_TRANSCRIPTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_TRANSCRIPTION_SETTINGS: "{{.TRANSCRIPTION_CONFIGURATION}}"
      AUDIO_TRANSCRIPTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_TRANSCRIPTION_ANIFLOW" --output json audio plan --analysis transcription
        --input "$AUDIO_TRANSCRIPTION_INPUT" --configuration "$AUDIO_TRANSCRIPTION_CONFIGURATION"
        --transcription-configuration "$AUDIO_TRANSCRIPTION_SETTINGS"

  audio:transcribe:
    desc: Observe a transcript through the pinned offline provider without modifying source media.
    requires:
      vars: [INPUT, CONFIGURATION, TRANSCRIPTION_CONFIGURATION, OUTPUT]
    env:
      AUDIO_TRANSCRIPTION_INPUT: "{{.INPUT}}"
      AUDIO_TRANSCRIPTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_TRANSCRIPTION_SETTINGS: "{{.TRANSCRIPTION_CONFIGURATION}}"
      AUDIO_TRANSCRIPTION_OUTPUT: "{{.OUTPUT}}"
      AUDIO_TRANSCRIPTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_TRANSCRIPTION_ANIFLOW" --output json audio transcribe
        --input "$AUDIO_TRANSCRIPTION_INPUT" --configuration "$AUDIO_TRANSCRIPTION_CONFIGURATION"
        --transcription-configuration "$AUDIO_TRANSCRIPTION_SETTINGS"
        --output-directory "$AUDIO_TRANSCRIPTION_OUTPUT"

  audio:transcription:resume:
    desc: Reobserve tool and model pins before compatible run-local transcription reuse.
    requires:
      vars: [INPUT, CONFIGURATION, TRANSCRIPTION_CONFIGURATION, RUN]
    env:
      AUDIO_TRANSCRIPTION_INPUT: "{{.INPUT}}"
      AUDIO_TRANSCRIPTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_TRANSCRIPTION_SETTINGS: "{{.TRANSCRIPTION_CONFIGURATION}}"
      AUDIO_TRANSCRIPTION_RUN: "{{.RUN}}"
      AUDIO_TRANSCRIPTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_TRANSCRIPTION_ANIFLOW" --output json audio resume "$AUDIO_TRANSCRIPTION_RUN" --analysis transcription
        --input "$AUDIO_TRANSCRIPTION_INPUT" --configuration "$AUDIO_TRANSCRIPTION_CONFIGURATION"
        --transcription-configuration "$AUDIO_TRANSCRIPTION_SETTINGS"

  audio:transcription:schema:
    desc: Validate transcription schemas and synthetic examples with installed jsonschema.
    cmds:
      - python3 tests/audio_transcription_schema.py

  audio:transcription:corpus:
    desc: Exercise synthetic transcription contracts, provider and CLI refusal fixtures.
    cmds:
      - cargo test --locked --test audio_transcription

  audio:transcript:export:
    desc: Export validated observed transcript evidence with explicit target losses.
    requires:
      vars: [TRANSCRIPTION, TO, OUTPUT]
    env:
      AUDIO_TRANSCRIPT_REPORT: "{{.TRANSCRIPTION}}"
      AUDIO_TRANSCRIPT_TO: "{{.TO}}"
      AUDIO_TRANSCRIPT_OUTPUT: "{{.OUTPUT}}"
      AUDIO_TRANSCRIPT_ALLOW_LOSS: '{{.ALLOW_LOSS | default ""}}'
      AUDIO_TRANSCRIPT_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - |
        set -- --output json audio transcript-export --transcription "$AUDIO_TRANSCRIPT_REPORT" --to "$AUDIO_TRANSCRIPT_TO" --output-directory "$AUDIO_TRANSCRIPT_OUTPUT"
        if [ -n "$AUDIO_TRANSCRIPT_ALLOW_LOSS" ]; then
          set -- "$@" --allow-loss "$AUDIO_TRANSCRIPT_ALLOW_LOSS"
        fi
        "$AUDIO_TRANSCRIPT_ANIFLOW" "$@"

  audio:lyrics:plan:
    desc: Preflight pinned local alignment dependencies and plan against exact reviewed lyrics.
    requires:
      vars: [INPUT, CONFIGURATION, ALIGNMENT_CONFIGURATION, LYRICS]
    env:
      AUDIO_ALIGNMENT_INPUT: "{{.INPUT}}"
      AUDIO_ALIGNMENT_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_ALIGNMENT_SETTINGS: "{{.ALIGNMENT_CONFIGURATION}}"
      AUDIO_ALIGNMENT_LYRICS: "{{.LYRICS}}"
      AUDIO_ALIGNMENT_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_ALIGNMENT_ANIFLOW" --output json audio plan --analysis lyrics-alignment
        --input "$AUDIO_ALIGNMENT_INPUT" --configuration "$AUDIO_ALIGNMENT_CONFIGURATION"
        --alignment-configuration "$AUDIO_ALIGNMENT_SETTINGS" --lyrics "$AUDIO_ALIGNMENT_LYRICS"

  audio:lyrics:align:
    desc: Propose source-relative candidate timing while preserving supplied reviewed lyrics.
    requires:
      vars: [INPUT, CONFIGURATION, ALIGNMENT_CONFIGURATION, LYRICS, OUTPUT]
    env:
      AUDIO_ALIGNMENT_INPUT: "{{.INPUT}}"
      AUDIO_ALIGNMENT_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_ALIGNMENT_SETTINGS: "{{.ALIGNMENT_CONFIGURATION}}"
      AUDIO_ALIGNMENT_LYRICS: "{{.LYRICS}}"
      AUDIO_ALIGNMENT_OUTPUT: "{{.OUTPUT}}"
      AUDIO_ALIGNMENT_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_ALIGNMENT_ANIFLOW" --output json audio lyrics align
        --input "$AUDIO_ALIGNMENT_INPUT" --configuration "$AUDIO_ALIGNMENT_CONFIGURATION"
        --alignment-configuration "$AUDIO_ALIGNMENT_SETTINGS" --lyrics "$AUDIO_ALIGNMENT_LYRICS"
        --output-directory "$AUDIO_ALIGNMENT_OUTPUT"

  audio:lyrics:resume:
    desc: Recheck source, reviewed-text bytes and dependency pins before run-local alignment reuse.
    requires:
      vars: [INPUT, CONFIGURATION, ALIGNMENT_CONFIGURATION, LYRICS, RUN]
    env:
      AUDIO_ALIGNMENT_INPUT: "{{.INPUT}}"
      AUDIO_ALIGNMENT_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_ALIGNMENT_SETTINGS: "{{.ALIGNMENT_CONFIGURATION}}"
      AUDIO_ALIGNMENT_LYRICS: "{{.LYRICS}}"
      AUDIO_ALIGNMENT_RUN: "{{.RUN}}"
      AUDIO_ALIGNMENT_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_ALIGNMENT_ANIFLOW" --output json audio resume "$AUDIO_ALIGNMENT_RUN" --analysis lyrics-alignment
        --input "$AUDIO_ALIGNMENT_INPUT" --configuration "$AUDIO_ALIGNMENT_CONFIGURATION"
        --alignment-configuration "$AUDIO_ALIGNMENT_SETTINGS" --lyrics "$AUDIO_ALIGNMENT_LYRICS"

  audio:lyrics:export:
    desc: Export candidate timing with all reviewed cues, explicit target losses and retained evidence.
    requires:
      vars: [ALIGNMENT, TO, OUTPUT]
    env:
      AUDIO_ALIGNMENT_REPORT: "{{.ALIGNMENT}}"
      AUDIO_ALIGNMENT_TO: "{{.TO}}"
      AUDIO_ALIGNMENT_OUTPUT: "{{.OUTPUT}}"
      AUDIO_ALIGNMENT_ALLOW_LOSS: '{{.ALLOW_LOSS | default ""}}'
      AUDIO_ALIGNMENT_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - |
        set -- --output json audio lyrics export --alignment "$AUDIO_ALIGNMENT_REPORT" --to "$AUDIO_ALIGNMENT_TO" --output-directory "$AUDIO_ALIGNMENT_OUTPUT"
        if [ -n "$AUDIO_ALIGNMENT_ALLOW_LOSS" ]; then
          set -- "$@" --allow-loss "$AUDIO_ALIGNMENT_ALLOW_LOSS"
        fi
        "$AUDIO_ALIGNMENT_ANIFLOW" "$@"

  audio:lyrics:schema:
    desc: Validate alignment contracts and synthetic examples with installed jsonschema.
    cmds:
      - python3 tests/audio_alignment_schema.py

  audio:lyrics:corpus:
    desc: Exercise synthetic reviewed-lyrics alignment and provider refusal fixtures.
    cmds:
      - cargo test --locked --test audio_alignment

  audio:musical:preflight:
    desc: Verify pinned musical dependencies and emit the source-bound musical plan without a workspace.
    requires:
      vars: [INPUT, CONFIGURATION, MUSICAL_CONFIGURATION]
    env:
      AUDIO_MUSICAL_INPUT: "{{.INPUT}}"
      AUDIO_MUSICAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_MUSICAL_MUSICAL_CONFIGURATION: "{{.MUSICAL_CONFIGURATION}}"
      AUDIO_MUSICAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_MUSICAL_ANIFLOW" --output json audio plan --analysis musical
        --input "$AUDIO_MUSICAL_INPUT" --configuration "$AUDIO_MUSICAL_CONFIGURATION"
        --musical-configuration "$AUDIO_MUSICAL_MUSICAL_CONFIGURATION"

  audio:musical:plan:
    desc: Plan bounded local tempo, beat and key estimates.
    requires:
      vars: [INPUT, CONFIGURATION, MUSICAL_CONFIGURATION]
    env:
      AUDIO_MUSICAL_INPUT: "{{.INPUT}}"
      AUDIO_MUSICAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_MUSICAL_MUSICAL_CONFIGURATION: "{{.MUSICAL_CONFIGURATION}}"
      AUDIO_MUSICAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_MUSICAL_ANIFLOW" --output json audio plan --analysis musical
        --input "$AUDIO_MUSICAL_INPUT" --configuration "$AUDIO_MUSICAL_CONFIGURATION"
        --musical-configuration "$AUDIO_MUSICAL_MUSICAL_CONFIGURATION"

  audio:musical:
    desc: Analyze bounded PCM audio with retained musical estimate uncertainty.
    requires:
      vars: [INPUT, CONFIGURATION, MUSICAL_CONFIGURATION, OUTPUT]
    env:
      AUDIO_MUSICAL_INPUT: "{{.INPUT}}"
      AUDIO_MUSICAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_MUSICAL_MUSICAL_CONFIGURATION: "{{.MUSICAL_CONFIGURATION}}"
      AUDIO_MUSICAL_OUTPUT: "{{.OUTPUT}}"
      AUDIO_MUSICAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_MUSICAL_ANIFLOW" --output json audio analyze --analysis musical
        --input "$AUDIO_MUSICAL_INPUT" --configuration "$AUDIO_MUSICAL_CONFIGURATION"
        --musical-configuration "$AUDIO_MUSICAL_MUSICAL_CONFIGURATION"
        --output-directory "$AUDIO_MUSICAL_OUTPUT"

  audio:musical:resume:
    desc: Recheck exact musical dependencies before run-local checkpoint reuse.
    requires:
      vars: [INPUT, CONFIGURATION, MUSICAL_CONFIGURATION, RUN]
    env:
      AUDIO_MUSICAL_INPUT: "{{.INPUT}}"
      AUDIO_MUSICAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_MUSICAL_MUSICAL_CONFIGURATION: "{{.MUSICAL_CONFIGURATION}}"
      AUDIO_MUSICAL_RUN: "{{.RUN}}"
      AUDIO_MUSICAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_MUSICAL_ANIFLOW" --output json audio resume "$AUDIO_MUSICAL_RUN" --analysis musical
        --input "$AUDIO_MUSICAL_INPUT" --configuration "$AUDIO_MUSICAL_CONFIGURATION"
        --musical-configuration "$AUDIO_MUSICAL_MUSICAL_CONFIGURATION"

  audio:musical:probe:
    desc: Observe already installed musical package identities using an explicitly selected Python.
    requires:
      vars: [PYTHON]
    env:
      AUDIO_MUSICAL_PYTHON: "{{.PYTHON}}"
    cmds:
      - >-
        "$AUDIO_MUSICAL_PYTHON" -I -B scripts/audio-musical-adapter.py --probe

  audio:musical:corpus:
    desc: Run generated musical fixtures against the explicitly installed analyzer without downloads.
    requires:
      vars: [PYTHON, ADAPTER, OUTPUT]
    env:
      AUDIO_MUSICAL_PYTHON: "{{.PYTHON}}"
      AUDIO_MUSICAL_ADAPTER: "{{.ADAPTER}}"
      AUDIO_MUSICAL_OUTPUT: "{{.OUTPUT}}"
    cmds:
      - >-
        python3 scripts/audio-musical-fixture-corpus.py
        --python "$AUDIO_MUSICAL_PYTHON" --adapter "$AUDIO_MUSICAL_ADAPTER"
        --output "$AUDIO_MUSICAL_OUTPUT"

  audio:musical:corpus:native:
    desc: Exercise native musical plan, analysis, status and resume on generated fixtures.
    requires:
      vars: [PYTHON, ADAPTER, ANIFLOW_BIN, OUTPUT]
    env:
      AUDIO_MUSICAL_PYTHON: "{{.PYTHON}}"
      AUDIO_MUSICAL_ADAPTER: "{{.ADAPTER}}"
      AUDIO_MUSICAL_ANIFLOW: "{{.ANIFLOW_BIN}}"
      AUDIO_MUSICAL_OUTPUT: "{{.OUTPUT}}"
    cmds:
      - >-
        python3 scripts/audio-musical-fixture-corpus.py
        --python "$AUDIO_MUSICAL_PYTHON" --adapter "$AUDIO_MUSICAL_ADAPTER"
        --aniflow "$AUDIO_MUSICAL_ANIFLOW" --output "$AUDIO_MUSICAL_OUTPUT"

  audio:stem:plan:
    desc: Plan full-stem technical analysis from accepted separation evidence.
    requires:
      vars: [INPUT, CONFIGURATION, STEM_RUN, STEM_STAGE, STEM_ID]
    env:
      AUDIO_STEM_INPUT: "{{.INPUT}}"
      AUDIO_STEM_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_STEM_STEM_RUN: "{{.STEM_RUN}}"
      AUDIO_STEM_STEM_STAGE: "{{.STEM_STAGE}}"
      AUDIO_STEM_STEM_ID: "{{.STEM_ID}}"
      AUDIO_STEM_TOLERANCE: '{{.STEM_DURATION_TOLERANCE_MILLISECONDS | default "20"}}'
      AUDIO_STEM_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_STEM_ANIFLOW" --output json audio plan
        --input "$AUDIO_STEM_INPUT" --configuration "$AUDIO_STEM_CONFIGURATION"
        --stem-run "$AUDIO_STEM_STEM_RUN" --stem-stage "$AUDIO_STEM_STEM_STAGE"
        --stem-id "$AUDIO_STEM_STEM_ID"
        --stem-duration-tolerance-milliseconds "$AUDIO_STEM_TOLERANCE"

  audio:stem:inspect:
    desc: Inspect a declared full stem while retaining its original-mix lineage.
    requires:
      vars: [INPUT, CONFIGURATION, STEM_RUN, STEM_STAGE, STEM_ID, OUTPUT]
    env:
      AUDIO_STEM_INPUT: "{{.INPUT}}"
      AUDIO_STEM_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_STEM_STEM_RUN: "{{.STEM_RUN}}"
      AUDIO_STEM_STEM_STAGE: "{{.STEM_STAGE}}"
      AUDIO_STEM_STEM_ID: "{{.STEM_ID}}"
      AUDIO_STEM_OUTPUT: "{{.OUTPUT}}"
      AUDIO_STEM_TOLERANCE: '{{.STEM_DURATION_TOLERANCE_MILLISECONDS | default "20"}}'
      AUDIO_STEM_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_STEM_ANIFLOW" --output json audio inspect
        --input "$AUDIO_STEM_INPUT" --configuration "$AUDIO_STEM_CONFIGURATION"
        --stem-run "$AUDIO_STEM_STEM_RUN" --stem-stage "$AUDIO_STEM_STEM_STAGE"
        --stem-id "$AUDIO_STEM_STEM_ID"
        --stem-duration-tolerance-milliseconds "$AUDIO_STEM_TOLERANCE"
        --output-directory "$AUDIO_STEM_OUTPUT"

  audio:stem:resume:
    desc: Recheck imported stem evidence before technical-analysis resume.
    requires:
      vars: [INPUT, CONFIGURATION, STEM_RUN, STEM_STAGE, STEM_ID, RUN]
    env:
      AUDIO_STEM_INPUT: "{{.INPUT}}"
      AUDIO_STEM_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_STEM_STEM_RUN: "{{.STEM_RUN}}"
      AUDIO_STEM_STEM_STAGE: "{{.STEM_STAGE}}"
      AUDIO_STEM_STEM_ID: "{{.STEM_ID}}"
      AUDIO_STEM_RUN: "{{.RUN}}"
      AUDIO_STEM_TOLERANCE: '{{.STEM_DURATION_TOLERANCE_MILLISECONDS | default "20"}}'
      AUDIO_STEM_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_STEM_ANIFLOW" --output json audio resume "$AUDIO_STEM_RUN"
        --input "$AUDIO_STEM_INPUT" --configuration "$AUDIO_STEM_CONFIGURATION"
        --stem-run "$AUDIO_STEM_STEM_RUN" --stem-stage "$AUDIO_STEM_STEM_STAGE"
        --stem-id "$AUDIO_STEM_STEM_ID"
        --stem-duration-tolerance-milliseconds "$AUDIO_STEM_TOLERANCE"

  audio:stem:signal:plan:
    desc: Plan full-stem signal analysis with its original-mix relationship.
    requires:
      vars: [INPUT, CONFIGURATION, STEM_RUN, STEM_STAGE, STEM_ID, SIGNAL_CONFIGURATION]
    env:
      AUDIO_STEM_INPUT: "{{.INPUT}}"
      AUDIO_STEM_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_STEM_STEM_RUN: "{{.STEM_RUN}}"
      AUDIO_STEM_STEM_STAGE: "{{.STEM_STAGE}}"
      AUDIO_STEM_STEM_ID: "{{.STEM_ID}}"
      AUDIO_STEM_SIGNAL_CONFIGURATION: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_STEM_TOLERANCE: '{{.STEM_DURATION_TOLERANCE_MILLISECONDS | default "20"}}'
      AUDIO_STEM_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_STEM_ANIFLOW" --output json audio plan --analysis signal
        --input "$AUDIO_STEM_INPUT" --configuration "$AUDIO_STEM_CONFIGURATION"
        --stem-run "$AUDIO_STEM_STEM_RUN" --stem-stage "$AUDIO_STEM_STEM_STAGE"
        --stem-id "$AUDIO_STEM_STEM_ID"
        --stem-duration-tolerance-milliseconds "$AUDIO_STEM_TOLERANCE"
        --signal-configuration "$AUDIO_STEM_SIGNAL_CONFIGURATION"

  audio:stem:signal:
    desc: Measure a declared full stem and preserve lineage in normalized analysis.
    requires:
      vars: [INPUT, CONFIGURATION, STEM_RUN, STEM_STAGE, STEM_ID, SIGNAL_CONFIGURATION, OUTPUT]
    env:
      AUDIO_STEM_INPUT: "{{.INPUT}}"
      AUDIO_STEM_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_STEM_STEM_RUN: "{{.STEM_RUN}}"
      AUDIO_STEM_STEM_STAGE: "{{.STEM_STAGE}}"
      AUDIO_STEM_STEM_ID: "{{.STEM_ID}}"
      AUDIO_STEM_SIGNAL_CONFIGURATION: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_STEM_OUTPUT: "{{.OUTPUT}}"
      AUDIO_STEM_TOLERANCE: '{{.STEM_DURATION_TOLERANCE_MILLISECONDS | default "20"}}'
      AUDIO_STEM_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_STEM_ANIFLOW" --output json audio analyze --analysis signal
        --input "$AUDIO_STEM_INPUT" --configuration "$AUDIO_STEM_CONFIGURATION"
        --stem-run "$AUDIO_STEM_STEM_RUN" --stem-stage "$AUDIO_STEM_STEM_STAGE"
        --stem-id "$AUDIO_STEM_STEM_ID"
        --stem-duration-tolerance-milliseconds "$AUDIO_STEM_TOLERANCE"
        --signal-configuration "$AUDIO_STEM_SIGNAL_CONFIGURATION"
        --output-directory "$AUDIO_STEM_OUTPUT"

  audio:stem:signal:resume:
    desc: Recheck imported stem evidence before signal-analysis resume.
    requires:
      vars: [INPUT, CONFIGURATION, STEM_RUN, STEM_STAGE, STEM_ID, SIGNAL_CONFIGURATION, RUN]
    env:
      AUDIO_STEM_INPUT: "{{.INPUT}}"
      AUDIO_STEM_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_STEM_STEM_RUN: "{{.STEM_RUN}}"
      AUDIO_STEM_STEM_STAGE: "{{.STEM_STAGE}}"
      AUDIO_STEM_STEM_ID: "{{.STEM_ID}}"
      AUDIO_STEM_SIGNAL_CONFIGURATION: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_STEM_RUN: "{{.RUN}}"
      AUDIO_STEM_TOLERANCE: '{{.STEM_DURATION_TOLERANCE_MILLISECONDS | default "20"}}'
      AUDIO_STEM_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_STEM_ANIFLOW" --output json audio resume "$AUDIO_STEM_RUN" --analysis signal
        --input "$AUDIO_STEM_INPUT" --configuration "$AUDIO_STEM_CONFIGURATION"
        --stem-run "$AUDIO_STEM_STEM_RUN" --stem-stage "$AUDIO_STEM_STEM_STAGE"
        --stem-id "$AUDIO_STEM_STEM_ID"
        --stem-duration-tolerance-milliseconds "$AUDIO_STEM_TOLERANCE"
        --signal-configuration "$AUDIO_STEM_SIGNAL_CONFIGURATION"

  audio:prepare:
    desc: Verify already installed Demucs/model assets and create a new local provider bundle.
    requires:
      vars: [PYTHON, FFMPEG, FFPROBE, MODEL_REPOSITORY, BUNDLE]
    env:
      DEMUCS_PYTHON: "{{.PYTHON}}"
      DEMUCS_FFMPEG: "{{.FFMPEG}}"
      DEMUCS_FFPROBE: "{{.FFPROBE}}"
      DEMUCS_MODELS: "{{.MODEL_REPOSITORY}}"
      DEMUCS_BUNDLE: "{{.BUNDLE}}"
    cmds:
      - >-
        python3 providers/demucs/workflow.py prepare
        --python "$DEMUCS_PYTHON" --ffmpeg "$DEMUCS_FFMPEG" --ffprobe "$DEMUCS_FFPROBE"
        --model-repository "$DEMUCS_MODELS" --output-directory "$DEMUCS_BUNDLE"

  audio:separate:
    desc: Separate bounded PCM WAV into vocal/accompaniment candidates using offline Pipeline v3.
    requires:
      vars: [INPUT, BUNDLE, OUTPUT, CPU_THREADS, MEMORY_MIB, STORAGE_MIB]
    env:
      DEMUCS_INPUT: "{{.INPUT}}"
      DEMUCS_BUNDLE: "{{.BUNDLE}}"
      DEMUCS_OUTPUT: "{{.OUTPUT}}"
      DEMUCS_CPU: "{{.CPU_THREADS}}"
      DEMUCS_MEMORY: "{{.MEMORY_MIB}}"
      DEMUCS_STORAGE: "{{.STORAGE_MIB}}"
      DEMUCS_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        python3 providers/demucs/workflow.py run
        --aniflow "$DEMUCS_ANIFLOW" --registration "$DEMUCS_BUNDLE/registration.json"
        --input "$DEMUCS_INPUT" --output-directory "$DEMUCS_OUTPUT"
        --host-cpu-threads "$DEMUCS_CPU" --host-memory-mib "$DEMUCS_MEMORY"
        --host-storage-mib "$DEMUCS_STORAGE"

  audio:resume:
    desc: Recheck external dependency identities before compatible Pipeline v3 resume.
    requires:
      vars: [INPUT, BUNDLE, RUN]
    env:
      DEMUCS_INPUT: "{{.INPUT}}"
      DEMUCS_BUNDLE: "{{.BUNDLE}}"
      DEMUCS_RUN: "{{.RUN}}"
      DEMUCS_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        python3 providers/demucs/workflow.py resume
        --aniflow "$DEMUCS_ANIFLOW" --registration "$DEMUCS_BUNDLE/registration.json"
        --input "$DEMUCS_INPUT" --run-directory "$DEMUCS_RUN"

  audio:test:
    desc: Test the Demucs adapter with synthetic WAV and fake dependencies only.
    cmds:
      - python3 -m unittest discover --start-directory tests/demucs
      - cargo test --locked --test demucs_provider

  lint:
    desc: Run strict Clippy checks.
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run the test suite.
    cmds:
      - cargo test --all-targets

  test:doc:
    desc: Run documentation tests.
    cmds:
      - cargo test --doc --locked

  package:check:
    desc: Verify the release package from the working tree.
    cmds:
      - cargo package --locked --allow-dirty

  smoke:
    desc: Run the synthetic end-to-end media test.
    cmds:
      - ./scripts/smoke-test.sh

  validate:
    desc: Run all repository validation.
    deps:
      - contracts:check
      - format:check
      - names:check
      - names:test
      - lint
      - package:check
      - provider:conformance
      - test
      - test:doc
      - smoke
