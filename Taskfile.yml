---
version: "3"

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  build:
    desc: Build the debug binary.
    cmds:
      - cargo build --all-targets

  build:release:
    desc: Build the optimized release binary.
    cmds:
      - cargo build --release

  check:
    desc: Run fast compiler checks.
    cmds:
      - cargo check --all-targets --locked

  format:
    desc: Format Rust source.
    cmds:
      - cargo fmt --all

  format:check:
    desc: Verify Rust formatting.
    cmds:
      - cargo fmt --all -- --check

  names:check:
    desc: Verify lowercase product naming.
    cmds:
      - ./scripts/check-product-names.sh

  names:test:
    desc: Test the lowercase product-name policy.
    cmds:
      - ./scripts/test-product-names.sh

  contracts:check:
    desc: Verify published JSON contracts and examples.
    cmds:
      - python3 scripts/check-contracts.py

  provider:conformance:
    desc: Verify the published provider conformance bundle.
    cmds:
      - cargo test --test provider_conformance --locked

  audio:contracts:
    desc: Verify synthetic normalized audio fixtures and public Rust contract validation.
    cmds:
      - python3 scripts/generate-audio-contract-fixtures.py --check
      - cargo test --locked --test audio_analysis_contracts

  audio:contracts:schema:
    desc: Validate audio examples with an already installed Python jsonschema package.
    cmds:
      - python3 tests/audio_contract_schema.py

  audio:inspect:plan:
    desc: Preflight explicitly pinned tools and emit a read-only audio inspection plan.
    requires:
      vars: [INPUT, CONFIGURATION]
    env:
      AUDIO_INSPECTION_INPUT: "{{.INPUT}}"
      AUDIO_INSPECTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_INSPECTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_INSPECTION_ANIFLOW" --output json audio plan
        --input "$AUDIO_INSPECTION_INPUT" --configuration "$AUDIO_INSPECTION_CONFIGURATION"

  audio:inspect:
    desc: Inspect bounded PCM WAV through Pipeline v3 without changing source media.
    requires:
      vars: [INPUT, CONFIGURATION, OUTPUT]
    env:
      AUDIO_INSPECTION_INPUT: "{{.INPUT}}"
      AUDIO_INSPECTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_INSPECTION_OUTPUT: "{{.OUTPUT}}"
      AUDIO_INSPECTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_INSPECTION_ANIFLOW" --output json audio inspect
        --input "$AUDIO_INSPECTION_INPUT" --configuration "$AUDIO_INSPECTION_CONFIGURATION"
        --output-directory "$AUDIO_INSPECTION_OUTPUT"

  audio:inspect:resume:
    desc: Recheck audio inspection dependencies and resume compatible run-local work.
    requires:
      vars: [INPUT, CONFIGURATION, RUN]
    env:
      AUDIO_INSPECTION_INPUT: "{{.INPUT}}"
      AUDIO_INSPECTION_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_INSPECTION_RUN: "{{.RUN}}"
      AUDIO_INSPECTION_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_INSPECTION_ANIFLOW" --output json audio resume "$AUDIO_INSPECTION_RUN"
        --input "$AUDIO_INSPECTION_INPUT" --configuration "$AUDIO_INSPECTION_CONFIGURATION"

  audio:signal:plan:
    desc: Preflight pinned audio tools and emit a two-stage signal-analysis plan.
    requires:
      vars: [INPUT, CONFIGURATION, SIGNAL_CONFIGURATION]
    env:
      AUDIO_SIGNAL_INPUT: "{{.INPUT}}"
      AUDIO_SIGNAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_SIGNAL_SETTINGS: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_SIGNAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_SIGNAL_ANIFLOW" --output json audio plan --analysis signal
        --input "$AUDIO_SIGNAL_INPUT" --configuration "$AUDIO_SIGNAL_CONFIGURATION"
        --signal-configuration "$AUDIO_SIGNAL_SETTINGS"

  audio:signal:
    desc: Measure bounded PCM audio without changing source bytes through Pipeline v3.
    requires:
      vars: [INPUT, CONFIGURATION, SIGNAL_CONFIGURATION, OUTPUT]
    env:
      AUDIO_SIGNAL_INPUT: "{{.INPUT}}"
      AUDIO_SIGNAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_SIGNAL_SETTINGS: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_SIGNAL_OUTPUT: "{{.OUTPUT}}"
      AUDIO_SIGNAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_SIGNAL_ANIFLOW" --output json audio analyze --analysis signal
        --input "$AUDIO_SIGNAL_INPUT" --configuration "$AUDIO_SIGNAL_CONFIGURATION"
        --signal-configuration "$AUDIO_SIGNAL_SETTINGS"
        --output-directory "$AUDIO_SIGNAL_OUTPUT"

  audio:signal:resume:
    desc: Recheck exact source, tool and signal settings before run-local checkpoint reuse.
    requires:
      vars: [INPUT, CONFIGURATION, SIGNAL_CONFIGURATION, RUN]
    env:
      AUDIO_SIGNAL_INPUT: "{{.INPUT}}"
      AUDIO_SIGNAL_CONFIGURATION: "{{.CONFIGURATION}}"
      AUDIO_SIGNAL_SETTINGS: "{{.SIGNAL_CONFIGURATION}}"
      AUDIO_SIGNAL_RUN: "{{.RUN}}"
      AUDIO_SIGNAL_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        "$AUDIO_SIGNAL_ANIFLOW" --output json audio resume "$AUDIO_SIGNAL_RUN" --analysis signal
        --input "$AUDIO_SIGNAL_INPUT" --configuration "$AUDIO_SIGNAL_CONFIGURATION"
        --signal-configuration "$AUDIO_SIGNAL_SETTINGS"

  audio:prepare:
    desc: Verify already installed Demucs/model assets and create a new local provider bundle.
    requires:
      vars: [PYTHON, FFMPEG, FFPROBE, MODEL_REPOSITORY, BUNDLE]
    env:
      DEMUCS_PYTHON: "{{.PYTHON}}"
      DEMUCS_FFMPEG: "{{.FFMPEG}}"
      DEMUCS_FFPROBE: "{{.FFPROBE}}"
      DEMUCS_MODELS: "{{.MODEL_REPOSITORY}}"
      DEMUCS_BUNDLE: "{{.BUNDLE}}"
    cmds:
      - >-
        python3 providers/demucs/workflow.py prepare
        --python "$DEMUCS_PYTHON" --ffmpeg "$DEMUCS_FFMPEG" --ffprobe "$DEMUCS_FFPROBE"
        --model-repository "$DEMUCS_MODELS" --output-directory "$DEMUCS_BUNDLE"

  audio:separate:
    desc: Separate bounded PCM WAV into vocal/accompaniment candidates using offline Pipeline v3.
    requires:
      vars: [INPUT, BUNDLE, OUTPUT, CPU_THREADS, MEMORY_MIB, STORAGE_MIB]
    env:
      DEMUCS_INPUT: "{{.INPUT}}"
      DEMUCS_BUNDLE: "{{.BUNDLE}}"
      DEMUCS_OUTPUT: "{{.OUTPUT}}"
      DEMUCS_CPU: "{{.CPU_THREADS}}"
      DEMUCS_MEMORY: "{{.MEMORY_MIB}}"
      DEMUCS_STORAGE: "{{.STORAGE_MIB}}"
      DEMUCS_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        python3 providers/demucs/workflow.py run
        --aniflow "$DEMUCS_ANIFLOW" --registration "$DEMUCS_BUNDLE/registration.json"
        --input "$DEMUCS_INPUT" --output-directory "$DEMUCS_OUTPUT"
        --host-cpu-threads "$DEMUCS_CPU" --host-memory-mib "$DEMUCS_MEMORY"
        --host-storage-mib "$DEMUCS_STORAGE"

  audio:resume:
    desc: Recheck external dependency identities before compatible Pipeline v3 resume.
    requires:
      vars: [INPUT, BUNDLE, RUN]
    env:
      DEMUCS_INPUT: "{{.INPUT}}"
      DEMUCS_BUNDLE: "{{.BUNDLE}}"
      DEMUCS_RUN: "{{.RUN}}"
      DEMUCS_ANIFLOW: '{{.ANIFLOW_BIN | default "aniflow"}}'
    cmds:
      - >-
        python3 providers/demucs/workflow.py resume
        --aniflow "$DEMUCS_ANIFLOW" --registration "$DEMUCS_BUNDLE/registration.json"
        --input "$DEMUCS_INPUT" --run-directory "$DEMUCS_RUN"

  audio:test:
    desc: Test the Demucs adapter with synthetic WAV and fake dependencies only.
    cmds:
      - python3 -m unittest discover --start-directory tests/demucs
      - cargo test --locked --test demucs_provider

  lint:
    desc: Run strict Clippy checks.
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run the test suite.
    cmds:
      - cargo test --all-targets

  test:doc:
    desc: Run documentation tests.
    cmds:
      - cargo test --doc --locked

  package:check:
    desc: Verify the release package from the working tree.
    cmds:
      - cargo package --locked --allow-dirty

  smoke:
    desc: Run the synthetic end-to-end media test.
    cmds:
      - ./scripts/smoke-test.sh

  validate:
    desc: Run all repository validation.
    deps:
      - contracts:check
      - format:check
      - names:check
      - names:test
      - lint
      - package:check
      - provider:conformance
      - test
      - test:doc
      - smoke
