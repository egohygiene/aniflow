[package]
name = "aniflow"
version = "0.2.0"
edition = "2024"
description = "A reproducible, resumable video-processing pipeline orchestrator"
license = "MIT"
repository = "https://github.com/egohygiene/aniflow"
readme = "README.md"
keywords = ["animation", "ffmpeg", "media", "pipeline", "video"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
